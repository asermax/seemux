name: CI

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - variant: layer-shell
            features: ""
          - variant: kwin
            features: "--features kwin --no-default-features"
    container:
      image: ghcr.io/asermax/seemux-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: seemux-ci

      - name: Run tests
        run: cargo test --locked ${{ matrix.features }}

  clippy:
    name: Clippy (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - variant: layer-shell
            features: ""
          - variant: kwin
            features: "--features kwin --no-default-features"
    container:
      image: ghcr.io/asermax/seemux-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: seemux-ci

      - name: Run clippy
        run: cargo clippy --locked ${{ matrix.features }}

  build-release:
    name: Build & Release
    needs: [test, clippy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: ghcr.io/asermax/seemux-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: seemux-ci

      - name: Build layer-shell release
        run: cargo build --release --locked

      - name: Save layer-shell binaries
        run: |
          strip target/release/seemux target/release/seemux-tmux-shim
          cp target/release/seemux seemux-linux-x86_64
          cp target/release/seemux-tmux-shim seemux-tmux-shim-linux-x86_64

      - name: Build KWin release
        run: cargo build --release --locked --features kwin --no-default-features

      - name: Save KWin binaries
        run: |
          strip target/release/seemux target/release/seemux-tmux-shim
          cp target/release/seemux seemux-kwin-linux-x86_64
          cp target/release/seemux-tmux-shim seemux-tmux-shim-kwin-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            seemux-linux-x86_64
            seemux-tmux-shim-linux-x86_64
            seemux-kwin-linux-x86_64
            seemux-tmux-shim-kwin-linux-x86_64
