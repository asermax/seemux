name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/asermax/seemux-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: seemux-ci

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy
        run: cargo clippy --locked

  release:
    name: Release
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    container:
      image: ghcr.io/asermax/seemux-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Determine version and create release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.released == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.release.outputs.released == 'true'
        with:
          shared-key: seemux-ci

      - name: Build release binary
        if: steps.release.outputs.released == 'true'
        run: cargo build --release --locked

      - name: Strip and rename binaries
        if: steps.release.outputs.released == 'true'
        run: |
          strip target/release/seemux target/release/seemux-tmux-shim
          cp target/release/seemux seemux-linux-x86_64
          cp target/release/seemux-tmux-shim seemux-tmux-shim-linux-x86_64

      - name: Attach binaries to GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            seemux-linux-x86_64
            seemux-tmux-shim-linux-x86_64
