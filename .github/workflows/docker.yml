name: Docker CI Image

on:
  push:
    branches: [master]
    paths: [Dockerfile]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/asermax/seemux-ci

jobs:
  build-image:
    name: Build & Push CI Image
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
